<li class="px-4 py-3 flex items-center gap-3">
  <button type="button"
          hx-post="{% url 'crm:followup_toggle' pk=a.pk %}"
          hx-target="#followup-panel" hx-swap="innerHTML"
          class="shrink-0 w-5 h-5 rounded-md border-2 border-[var(--hairline)] hover:border-[var(--accent)] flex items-center justify-center transition"
          aria-label="Mark done">
    {% if a.done %}<i data-lucide="check" class="w-3.5 h-3.5 brand-text"></i>{% endif %}
  </button>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-semibold text-[var(--ink-display)] truncate">{{ a.subject|default:"Follow-up" }}</p>
    <a href="{% url 'crm:contact_detail' pk=a.contact.pk %}" class="text-xs brand-link hover:underline">{{ a.contact.full_name }}</a>
    {% if a.notes %}<p class="text-xs text-[var(--ink-muted)] truncate mt-0.5">{{ a.notes }}</p>{% endif %}
  </div>
  <div class="text-right shrink-0">
    {% if a.due_at %}
    <p class="text-[11px] font-semibold text-[var(--ink-muted)]">{{ a.due_at|date:"D, M j" }}</p>
    <p class="text-[11px] text-[var(--ink-muted)]">{{ a.due_at|date:"H:i" }}</p>
    {% else %}
    <p class="text-[11px] text-[var(--ink-muted)]">No date</p>
    {% endif %}
  </div>
</li>
