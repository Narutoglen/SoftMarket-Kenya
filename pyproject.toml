[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*", ".venv"]

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, flake8-bugbear, comprehensions, pyupgrade, django
select = ["E", "F", "I", "B", "C4", "UP", "DJ"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
    "B008",   # function calls in defaults are idiomatic in DRF/Django signatures
]

[tool.ruff.lint.isort]
known-first-party = ["marketplace", "crm", "softmarket"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "/migrations/"
