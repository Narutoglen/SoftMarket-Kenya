<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t1 d1">
  <title id="t1">Nairobi retail dashboard mockup</title>
  <desc id="d1">Monochrome analytics dashboard mockup with sidebar, KPI tiles and a sales chart.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d120e"/>
      <stop offset="1" stop-color="#050705"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a3f3a"/>
      <stop offset="1" stop-color="#9aa39a"/>
    </linearGradient>
  </defs>

  <!-- app window -->
  <rect width="1200" height="800" fill="url(#g1)"/>
  <rect x="0" y="0" width="1200" height="64" fill="#111611"/>
  <circle cx="34" cy="32" r="6" fill="#cfd4cf"/>
  <circle cx="58" cy="32" r="6" fill="#6c726c"/>
  <circle cx="82" cy="32" r="6" fill="#3a3f3a"/>
  <rect x="320" y="20" width="560" height="24" rx="12" fill="#1a201a"/>
  <rect x="1112" y="18" width="76" height="28" rx="14" fill="#2a302a"/>

  <!-- sidebar -->
  <rect x="0" y="64" width="220" height="736" fill="#101510"/>
  <rect x="28" y="104" width="120" height="14" rx="7" fill="#cfd4cf"/>
  <rect x="28" y="160" width="164" height="12" rx="6" fill="#3f463f"/>
  <rect x="28" y="200" width="140" height="12" rx="6" fill="#4a514a"/>
  <rect x="28" y="240" width="156" height="12" rx="6" fill="#4a514a"/>
  <rect x="28" y="280" width="120" height="12" rx="6" fill="#4a514a"/>
  <rect x="20" y="184" width="4" height="36" rx="2" fill="#cfd4cf"/>
  <rect x="28" y="340" width="132" height="12" rx="6" fill="#3f463f"/>
  <rect x="28" y="380" width="148" height="12" rx="6" fill="#3f463f"/>

  <!-- KPI tiles -->
  <g>
    <rect x="260" y="96" width="280" height="120" rx="18" fill="#161c16"/>
    <rect x="284" y="124" width="120" height="12" rx="6" fill="#5a615a"/>
    <text x="284" y="184" fill="#eef1ec" font-family="Manrope, Arial, sans-serif" font-size="46" font-weight="700">KSh 1.2M</text>

    <rect x="560" y="96" width="280" height="120" rx="18" fill="#161c16"/>
    <rect x="584" y="124" width="120" height="12" rx="6" fill="#5a615a"/>
    <text x="584" y="184" fill="#eef1ec" font-family="Manrope, Arial, sans-serif" font-size="46" font-weight="700">3,418</text>

    <rect x="860" y="96" width="280" height="120" rx="18" fill="#161c16"/>
    <rect x="884" y="124" width="120" height="12" rx="6" fill="#5a615a"/>
    <text x="884" y="184" fill="#eef1ec" font-family="Manrope, Arial, sans-serif" font-size="46" font-weight="700">92%</text>
  </g>

  <!-- chart card -->
  <rect x="260" y="248" width="600" height="300" rx="18" fill="#161c16"/>
  <rect x="288" y="280" width="180" height="14" rx="7" fill="#cfd4cf"/>
  <polyline points="288,500 360,470 432,486 504,430 576,452 648,396 720,420 792,372 840,400"
            fill="none" stroke="url(#chart)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9aa39a">
    <circle cx="360" cy="470" r="6"/><circle cx="504" cy="430" r="6"/><circle cx="648" cy="396" r="6"/><circle cx="840" cy="400" r="6"/>
  </g>
  <line x1="288" y1="498" x2="840" y2="498" stroke="#2a302a" stroke-width="2"/>

  <!-- side list card -->
  <rect x="880" y="248" width="260" height="300" rx="18" fill="#161c16"/>
  <rect x="906" y="280" width="140" height="14" rx="7" fill="#cfd4cf"/>
  <g fill="#4a514a">
    <rect x="906" y="320" width="208" height="10" rx="5"/>
    <rect x="906" y="352" width="178" height="10" rx="5"/>
    <rect x="906" y="384" width="200" height="10" rx="5"/>
    <rect x="906" y="416" width="160" height="10" rx="5"/>
    <rect x="906" y="448" width="196" height="10" rx="5"/>
    <rect x="906" y="480" width="170" height="10" rx="5"/>
  </g>

  <!-- bottom table strip -->
  <rect x="260" y="580" width="880" height="150" rx="18" fill="#161c16"/>
  <g fill="#3f463f">
    <rect x="288" y="612" width="120" height="12" rx="6"/>
    <rect x="468" y="612" width="120" height="12" rx="6"/>
    <rect x="648" y="612" width="120" height="12" rx="6"/>
    <rect x="828" y="612" width="120" height="12" rx="6"/>
  </g>
  <g fill="#5a615a">
    <rect x="288" y="648" width="200" height="10" rx="5"/>
    <rect x="468" y="648" width="90" height="10" rx="5"/>
    <rect x="648" y="648" width="140" height="10" rx="5"/>
    <rect x="828" y="648" width="70" height="10" rx="5"/>
    <rect x="288" y="684" width="160" height="10" rx="5"/>
    <rect x="468" y="684" width="110" height="10" rx="5"/>
    <rect x="648" y="684" width="120" height="10" rx="5"/>
    <rect x="828" y="684" width="90" height="10" rx="5"/>
  </g>
</svg>
